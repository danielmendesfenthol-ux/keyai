<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Key AI — Chat Futurista Real</title>
  <meta name="theme-color" content="#e10600" />
  <meta name="description" content="Key AI com interface vermelha futurista, chat com IA real via backend, sessões salvas localmente." />
  <style>
    :root{ --bg:#0a0a0f; --bg-2:#0d0d14; --red:#e10600; --red-2:#ff2a1a; --red-3:#ff5c49; --text:#e9e9ef; --muted:#b8b8c7; --border:#261416; --glow:#ff2a1a88; }
    *{box-sizing:border-box} html,body{height:100%}
    body{ margin:0; color:var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 600px at 10% -20%, #3b0006 0%, transparent 40%), radial-gradient(1000px 500px at 90% 120%, #170004 0%, transparent 45%), linear-gradient(180deg, var(--bg), var(--bg-2));
      overflow:hidden; letter-spacing:.2px; }
    .frame{ position:fixed; inset:12px; border:1px solid var(--border); border-radius:18px;
      box-shadow: 0 0 0 1px #1a0b0c inset, 0 0 40px 6px #28000055 inset, 0 0 80px 8px #1a000055 inset, 0 0 60px 10px #000000aa;
      background: linear-gradient(180deg, #0b0b12 0%, #0c0b11 100%);
      display:grid; grid-template-columns:320px 1fr; grid-template-rows:auto 1fr auto; grid-template-areas:"top top" "side main" "side input"; }
    .top{ grid-area:top; display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border);
      background: linear-gradient(180deg, #0e0d14 0%, #0a0a10 100%); }
    .logo{ display:flex; align-items:center; gap:10px; font-weight:700; text-transform:uppercase; letter-spacing:.18em; }
    .glyph{ width:28px; height:28px; border-radius:8px; background:conic-gradient(from 220deg, var(--red), var(--red-2), var(--red-3), var(--red)); box-shadow:0 0 18px 4px var(--glow); position:relative; overflow:hidden; }
    .glyph::after{ content:""; position:absolute; inset:2px; border:1px solid #ffb6ae22; border-radius:6px; box-shadow:0 0 12px 2px #ff3c2e44 inset; }
    .tag{ color:var(--muted); font-size:.9rem; background: linear-gradient(90deg, #160808, #0c0c12); border:1px solid var(--border); padding:6px 10px; border-radius:999px; }
    .side{ grid-area:side; border-right:1px solid var(--border); background: linear-gradient(180deg, #0b0b12 0%, #0a0a11 100%); display:flex; flex-direction:column; min-width:0; }
    .side-header{ padding:14px 16px; display:flex; align-items:center; gap:8px; justify-content:space-between; border-bottom:1px dashed #261416; }
    .side-header h3{ margin:0; font-size:.95rem; font-weight:600; color:#ffbdb6; letter-spacing:.12em; }
    .side-actions{ display:flex; gap:8px; }
    .btn{ all:unset; cursor:pointer; padding:8px 12px; border-radius:10px; border:1px solid var(--border); color:var(--text);
      background:linear-gradient(180deg,#13090a,#0d0b0c); box-shadow:0 0 10px 0 #00000055; font-weight:600; transition:transform .08s ease, border-color .2s ease; }
    .btn:hover{ transform: translateY(-1px); border-color:#3a1b1d; }
    .btn.primary{ background: linear-gradient(180deg, #2b0c0d, #1a090a); border-color:#3a1516; color:#ffd1cb; box-shadow:0 0 20px 4px var(--glow); }
    .btn.danger{ border-color:#3a1516; color:#ffcac4; }
    .session-list{ overflow:auto; flex:1; padding:10px; }
    .session{ display:flex; align-items:center; gap:10px; padding:10px 12px; margin:8px 0; border:1px solid var(--border); border-radius:12px;
      background: linear-gradient(180deg,#0f0d10,#0c0c12); cursor:pointer; transition:border-color .15s ease, box-shadow .15s ease; }
    .session.active{ border-color:#4a1f21; box-shadow:0 0 16px 2px #ff1e0c22; }
    .session-title{ flex:1; font-weight:600; color:#ffd4ce; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .session-meta{ font-size:.78rem; color:#e0a49e; }
    .main{ grid-area:main; position:relative; overflow:hidden; background: radial-gradient(600px 300px at 50% 0%, #1d0a0d33 0%, transparent 40%), linear-gradient(180deg, #0b0b12, #0a0a10); }
    .chat{ position:absolute; inset:0; overflow:auto; padding:20px 22px 120px; }
    .msg{ display:flex; gap:12px; margin:12px 0; align-items:flex-start; }
    .avatar{ width:32px; height:32px; border-radius:8px; flex:0 0 32px; background: linear-gradient(180deg,#2b0c0d,#140708); border:1px solid var(--border); box-shadow:0 0 12px 2px #ff1e0c44; }
    .msg.ai .avatar{ background: conic-gradient(from 180deg, var(--red), var(--red-2), var(--red-3), var(--red)); }
    .bubble{ flex:1; background: linear-gradient(180deg,#121018,#0d0d14); border:1px solid #221217; border-radius:14px; padding:12px 14px; box-shadow: 0 3px 12px 0 #00000066; }
    .msg.ai .bubble{ border-color:#371214; box-shadow:0 0 22px 0 var(--glow); }
    .name{ font-size:.82rem; color:#ffb9b0; font-weight:700; letter-spacing:.08em; }
    .time{ font-size:.72rem; color:#c59a95; }
    .text{ margin-top:6px; line-height:1.55; color:#eee; }
    .input{ grid-area:input; border-top:1px solid var(--border); background: linear-gradient(180deg,#0b0b12,#0a0a10); padding:12px 16px;
      display:grid; grid-template-columns: 320px 1fr auto; gap:12px; align-items:center; }
    .typing{ display:flex; align-items:center; gap:8px; color:#ffb9b0; font-size:.9rem; padding:0 8px; animation:pulse 1.6s infinite; }
    .dot{ width:6px; height:6px; border-radius:50%; background:var(--red-2); box-shadow:0 0 8px 2px var(--glow) }
    .dot:nth-child(2){ animation:blink .8s .2s infinite } .dot:nth-child(3){ animation:blink .8s .4s infinite }
    @keyframes blink{ 0%,100%{opacity:.25} 50%{opacity:1} } @keyframes pulse{ 0%,100%{opacity:.9} 50%{opacity:.6} }
    .prompt-wrap{ grid-column:2; display:flex; gap:12px; align-items:center; background: linear-gradient(180deg,#100e15,#0d0c12); border:1px solid var(--border); border-radius:14px; padding:10px 12px; box-shadow:0 0 20px 4px #00000055 inset; }
    .prompt{ flex:1; resize:none; border:none; outline:none; background:transparent; color:var(--text); font-size:1rem; line-height:1.5; max-height:140px; }
    .send{ grid-column:3; padding:12px 16px; background: linear-gradient(180deg, #3a0f11, #23090a); border:1px solid #4a1d1e; border-radius:14px; color:#ffd6d0; font-weight:800; letter-spacing:.14em; box-shadow:0 0 24px 4px var(--glow); cursor:pointer; transition:transform .08s ease; }
    .send:active{ transform: translateY(1px) }
    .chat::-webkit-scrollbar, .session-list::-webkit-scrollbar{ width:10px }
    .chat::-webkit-scrollbar-thumb, .session-list::-webkit-scrollbar-thumb{
      background: linear-gradient(180deg,#24090a,#150708); border:1px solid #311113; border-radius:8px; box-shadow:0 0 12px 2px var(--glow);
    }
    @media (max-width:1000px){
      .frame{ grid-template-columns:1fr; grid-template-areas:"top" "main" "input"; }
      .side{ display:none } .input{ grid-template-columns:1fr auto } .prompt-wrap{ grid-column:1 } .send{ grid-column:2 }
    }
  </style>
</head>
<body>
  <div class="frame" aria-label="Janela principal de chat Key AI">
    <div class="top">
      <div class="logo"><div class="glyph" aria-hidden="true"></div><div>KEY AI</div></div>
      <div class="tag">Interface Vermelha Futurista</div>
      <div class="tag">IA Real (via backend)</div>
      <div class="tag">Conversas por dispositivo</div>
    </div>

    <aside class="side" aria-label="Sessões de chat">
      <div class="side-header">
        <h3>Sessões</h3>
        <div class="side-actions">
          <button class="btn primary" id="newSession">Nova</button>
          <button class="btn danger" id="deleteSession" title="Apagar sessão ativa">Apagar</button>
        </div>
      </div>
      <div class="session-list" id="sessionList"></div>
    </aside>

    <main class="main">
      <div class="chat" id="chat"></div>
    </main>

    <div class="input">
      <div class="typing" id="typing" aria-live="polite" style="visibility:hidden">
        <span>Key AI está pensando</span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <div class="prompt-wrap">
        <textarea id="prompt" class="prompt" rows="1" placeholder="Escreva sua mensagem para a Key AI..."></textarea>
      </div>
      <button class="send" id="sendBtn">ENVIAR</button>
    </div>
  </div>

  <script>
    function uuid(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{ const r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8); return v.toString(16); }); }
    function escapeHTML(str){ return String(str).replace(/[&<>"']/g, s=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[s]); }
    function linkify(text){ const safe=escapeHTML(text); return safe.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\n/g,'<br/>'); }
    function formatTime(ts){ const d=new Date(ts); return d.toLocaleString('pt-BR',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}); }

    const DEVICE_KEY='keyai_device_id';
    let deviceId=localStorage.getItem(DEVICE_KEY);
    if(!deviceId){ deviceId=uuid(); localStorage.setItem(DEVICE_KEY, deviceId); }
    const STORE_KEY=`keyai_sessions_${deviceId}`;

    let sessions={}; let activeSessionId=null;

    const sessionListEl=document.getElementById('sessionList');
    const chatEl=document.getElementById('chat');
    const promptEl=document.getElementById('prompt');
    const sendBtn=document.getElementById('sendBtn');
    const typingEl=document.getElementById('typing');
    const newSessionBtn=document.getElementById('newSession');
    const deleteSessionBtn=document.getElementById('deleteSession');

    function loadSessions(){
      try{ sessions=JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); }catch{ sessions={}; }
      if(!Object.keys(sessions).length){ createSession('Primeira conversa'); }
      else{ activeSessionId=Object.values(sessions).sort((a,b)=>b.updatedAt-a.updatedAt)[0].id; }
      renderSessions(); renderChat();
    }
    function saveSessions(){ localStorage.setItem(STORE_KEY, JSON.stringify(sessions)); }

    function createSession(title){
      const id=uuid(); const now=Date.now();
      sessions[id]={ id, title:title||'Nova conversa', messages:[], createdAt:now, updatedAt:now };
      activeSessionId=id; saveSessions(); renderSessions(); renderChat();
    }
    function deleteActiveSession(){
      if(!activeSessionId) return;
      const ids=Object.keys(sessions);
      if(ids.length<=1){ sessions[activeSessionId].messages=[]; sessions[activeSessionId].updatedAt=Date.now(); }
      else{
        delete sessions[activeSessionId];
        const next=Object.values(sessions).sort((a,b)=>b.updatedAt-a.updatedAt)[0];
        activeSessionId=next?.id||null;
      }
      saveSessions(); renderSessions(); renderChat();
    }
    function setActiveSession(id){ activeSessionId=id; renderSessions(); renderChat(); }
    function renameSessionTitleFromPrompt(text){
      const clean=String(text||'').trim(); if(!clean) return;
      const title=clean.length>32? clean.slice(0,32)+'…' : clean;
      const s=sessions[activeSessionId]; if(s && s.messages.length<=1){ s.title=title; saveSessions(); renderSessions(); }
    }

    function renderSessions(){
      sessionListEl.innerHTML='';
      Object.values(sessions).sort((a,b)=>b.updatedAt-a.updatedAt).forEach(s=>{
        const el=document.createElement('div');
        el.className='session'+(s.id===activeSessionId?' active':'');
        el.title=s.title;
        el.innerHTML=`<div class="session-title">${escapeHTML(s.title)}</div><div class="session-meta">${s.messages.length||0} msgs</div>`;
        el.addEventListener('click', ()=> setActiveSession(s.id));
        sessionListEl.appendChild(el);
      });
    }
    function renderChat(){
      chatEl.innerHTML='';
      const s=sessions[activeSessionId]; if(!s) return;
      s.messages.forEach(m=> chatEl.appendChild(renderMessage(m)) );
      chatEl.scrollTop=chatEl.scrollHeight;
    }
    function renderMessage(m){
      const wrap=document.createElement('div');
      wrap.className='msg '+(m.role==='user'?'user':'ai');
      wrap.innerHTML=`
        <div class="avatar" aria-hidden="true"></div>
        <div class="bubble">
          <div class="name">${m.role==='user'?'Você':'Key AI'}</div>
          <div class="time">${formatTime(m.time)}</div>
          <div class="text">${linkify(m.content)}</div>
        </div>`;
      return wrap;
    }
    function addMessage(role, content){
      const s=sessions[activeSessionId];
      const msg={ id:uuid(), role, content, time:Date.now() };
      s.messages.push(msg); s.updatedAt=Date.now();
      saveSessions(); chatEl.appendChild(renderMessage(msg));
      chatEl.scrollTop=chatEl.scrollHeight;
      return msg;
    }

    sendBtn.addEventListener('click', handleSend);
    promptEl.addEventListener('input', ()=>{ promptEl.style.height='auto'; promptEl.style.height=Math.min(promptEl.scrollHeight,140)+'px'; });
    promptEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); } });
    newSessionBtn.addEventListener('click', ()=> createSession('Nova conversa'));
    deleteSessionBtn.addEventListener('click', deleteActiveSession);
    function showTyping(show){ typingEl.style.visibility=show?'visible':'hidden'; }

    // Troque pelo link do seu servidor quando hospedar (ex.: https://seuprojeto.vercel.app/api/chat)
    const BASE_URL = 'http://localhost:3000/api/chat';

    async function handleSend(){
      const text=promptEl.value.trim(); if(!text) return;
      promptEl.value=''; promptEl.dispatchEvent(new Event('input'));
      renameSessionTitleFromPrompt(text);
      addMessage('user', text);
      showTyping(true);

      try{
        const s=sessions[activeSessionId];
        const payload={ deviceId, sessionId:activeSessionId, messages:s.messages.map(m=>({ role:m.role, content:m.content })) };

        const res=await fetch(BASE_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(payload) });
        if(!res.ok){
          const errText=await res.text();
          addMessage('ai', 'Erro ao conectar à IA: '+ errText);
        }else{
          const data=await res.json();
          addMessage('ai', data.reply || 'Sem resposta.');
        }
        s.updatedAt=Date.now(); saveSessions();
      }catch(err){
        addMessage('ai', 'Desculpe, houve um problema de rede. Tente novamente.');
        console.error(err);
      }finally{
        showTyping(false);
      }
    }

    loadSessions();
    const s0=sessions[activeSessionId];
    if(s0.messages.length===0){
      addMessage('ai', "Bem-vindo à Key AI real. Diga seu objetivo em uma frase e eu vou direto ao que importa.");
    }
  </script>
</body>
</html>
